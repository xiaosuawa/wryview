[package]
name = "wryview"
version = "0.5.5"
edition = "2021"
description = "Python binding for wry — embeddable cross-platform WebView."

[lib]
name = "wryview"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.30", features = ["extension-module", "abi3-py310"] }
wry = { version = "0.56", features = ["devtools"] }
raw-window-handle = "0.6"

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
gtk = "0.18"

[profile.release]
lto = true
codegen-units = 1
