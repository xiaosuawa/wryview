name: CI

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: ubuntu-latest
            target: x86_64
    steps:
      - uses: actions/checkout@v7
      - name: Install webkit2gtk
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
      - name: Repair manylinux (exclude system GTK/GLib — must not bundle)
        run: |
          pip install auditwheel
          # GLib/GTK/soup libraries can never be bundled into the wheel:
          # any system with webkit2gtk-4.1 installed provides the whole
          # chain as system libs (the webkit .deb depends on them), and the
          # GObject type registry is process-global — a second copy of a
          # GObject-based library (gdk, gtk, libsoup, pango, …) breaks any
          # process that also links the system one (e.g. LumiView's tao
          # window → "cannot register existing type 'GdkDisplayManager'").
          auditwheel repair \
            --exclude 'libwebkit2gtk-4.1.*' \
            --exclude 'libjavascriptcoregtk-4.1.*' \
            --exclude 'libgtk-3.*' \
            --exclude 'libgdk-3.*' \
            --exclude 'libgdk_pixbuf-2.0.*' \
            --exclude 'libglib-2.0.*' \
            --exclude 'libgobject-2.0.*' \
            --exclude 'libgmodule-2.0.*' \
            --exclude 'libgio-2.0.*' \
            --exclude 'libsoup-3.*' \
            --exclude 'libpango-1.0.*' \
            --exclude 'libpangocairo-1.0.*' \
            --exclude 'libpangoft2-1.0.*' \
            --exclude 'libatk-1.0.*' \
            --exclude 'libatk-bridge-2.0.*' \
            --exclude 'libharfbuzz.*' \
            --exclude 'libfribidi.*' \
            --exclude 'libepoxy.*' \
            --exclude 'libcairo.*' \
            --exclude 'libcairo-gobject.*' \
            --exclude 'libxkbcommon.*' \
            --exclude 'libwayland-client.*' \
            --exclude 'libdbus-1.*' \
            --exclude 'libsqlite3.*' \
            --exclude 'libkrb5.*' \
            --exclude 'libgssapi_krb5.*' \
            --exclude 'libk5crypto.*' \
            --exclude 'libkrb5support.*' \
            --exclude 'libcom_err.*' \
            --exclude 'libkeyutils.*' \
            --exclude 'libnghttp2.*' \
            --exclude 'libpsl.*' \
            --exclude 'libidn2.*' \
            --exclude 'libunistring.*' \
            --exclude 'libbrotli*.*' \
            -w dist dist/wryview-*.whl
          rm dist/*-linux_x86_64.whl
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-linux-${{ matrix.platform.target }}
          path: dist

  windows:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: windows-latest
            target: x64
          - runner: windows-latest
            target: x86
            python-arch: x86
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          architecture: ${{ matrix.platform.python-arch || 'x64' }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-windows-${{ matrix.platform.target }}
          path: dist

  macos:
    runs-on: ${{ matrix.platform.runner }}
    strategy:
      matrix:
        platform:
          - runner: macos-latest
            target: aarch64
          - runner: macos-14
            target: x86_64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.platform.target }}
          args: --release --out dist --find-interpreter
      - name: Upload wheels
        uses: actions/upload-artifact@v4
        with:
          name: wheels-macos-${{ matrix.platform.target }}
          path: dist

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  pypi-publish:
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos, sdist]
    permissions:
      id-token: write
      contents: read
    environment:
      name: pypi
      url: https://pypi.org/project/wryview/
    steps:
      - uses: actions/checkout@v7

      - name: Validate version match
        shell: pwsh
        run: |
          $pyprojectVersion = (Select-String -Path pyproject.toml -Pattern 'version = "(.+?)"').Matches.Groups[1].Value
          $gitTag = "${{ github.ref }}".Split('/')[-1]
          $gitTagVersion = $gitTag.TrimStart('v')
          if ($pyprojectVersion -ne $gitTagVersion) {
            Write-Error "Version mismatch: pyproject.toml=$pyprojectVersion vs tag=$gitTag"
            exit 1
          }
          Write-Host "Versions match: $pyprojectVersion"

      - name: Retrieve release distributions
        uses: actions/download-artifact@v4
        with:
          pattern: wheels-*
          path: dist/
          merge-multiple: true

      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
